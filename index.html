<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASIM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6c63ff, #24c6dc);
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: min(760px, 92vh);
      background: #f6f7fb;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
    }

    header {
      background: #5b54e8;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: white;
      color: #5b54e8;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    .header-text h1 {
      font-size: 20px;
    }

    .header-text p {
      margin-top: 3px;
      font-size: 13px;
      opacity: 0.85;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 15px;
    }

    .received {
      align-self: flex-start;
      background: white;
      color: #20222d;
      border-bottom-left-radius: 4px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }

    .sent {
      align-self: flex-end;
      background: #5b54e8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .time {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      opacity: 0.65;
    }

    .input-area {
      background: white;
      border-top: 1px solid #e8e8ef;
      padding: 12px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      background: #f1f2f7;
      border-radius: 22px;
      padding: 13px 16px;
      font-size: 15px;
    }

    button {
      width: 48px;
      border: none;
      border-radius: 50%;
      background: #5b54e8;
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    button:hover {
      background: #4640c9;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="avatar">F</div>
      <div class="header-text">
        <h1>FLASIM</h1>
        <p>🟢 Online</p>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="message received">
        Mirë se erdhe te FLASIM! 👋
        <span class="time">Tani</span>
      </div>

      <div class="message received">
        Shkruaj një mesazh për të filluar bisedën.
        <span class="time">Tani</span>
      </div>
    </section>

    <form class="input-area" id="chatForm">
      <input id="messageInput" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off" />
      <button type="submit" aria-label="Dërgo mesazhin">➤</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement("div");
      message.className = "message sent";
      message.textContent = text;

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = "Tani";

      message.appendChild(time);
      messages.appendChild(message);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
