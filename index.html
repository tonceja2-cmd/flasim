<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASIM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #6c63ff, #24c6dc);
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: min(760px, 92vh);
      overflow: hidden;
      border-radius: 28px;
      background: #f6f7fb;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .28);
    }

    .screen { height: 100%; display: flex; flex-direction: column; }
    .hidden { display: none; }

    header {
      color: white;
      background: #5b54e8;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 { font-size: 21px; }
    .subtitle { margin-top: 3px; font-size: 13px; opacity: .85; }

    .avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 50%;
      color: #5b54e8;
      background: white;
      font-weight: bold;
      font-size: 18px;
    }

    .header-text { flex: 1; }

    .profile-button, .back-button {
      border: none;
      color: white;
      background: transparent;
      cursor: pointer;
      font-size: 24px;
    }

    .back-button { width: 28px; }

    .contacts {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .contact {
      width: 100%;
      margin-bottom: 10px;
      padding: 14px;
      border: none;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      background: white;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
    }

    .contact:hover { background: #f0efff; }

    .contact-info { flex: 1; }
    .contact-name { color: #20222d; font-size: 16px; font-weight: bold; }
    .last-message { margin-top: 4px; color: #797b88; font-size: 13px; }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #20c56a;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      align-self: flex-start;
      color: #20222d;
      background: white;
      border-bottom-left-radius: 4px;
    }

    .sent {
      align-self: flex-end;
      color: white;
      background: #5b54e8;
      border-bottom-right-radius: 4px;
    }

    .time { display: block; margin-top: 5px; font-size: 11px; opacity: .65; }

    .input-area {
      padding: 12px;
      display: flex;
      gap: 10px;
      background: white;
      border-top: 1px solid #e8e8ef;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 13px 16px;
      background: #f1f2f7;
      font-size: 15px;
    }

    .send-button, .save-button {
      border: none;
      cursor: pointer;
      color: white;
      background: #5b54e8;
    }

    .send-button {
      width: 48px;
      border-radius: 50%;
      font-size: 20px;
    }

    .profile-content {
      flex: 1;
      padding: 32px 22px;
      text-align: center;
    }

    .large-avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #5b54e8;
      font-weight: bold;
      font-size: 42px;
    }

    .profile-content h2 { color: #20222d; margin-bottom: 8px; }
    .profile-content p { color: #797b88; margin-bottom: 28px; }

    .name-label {
      display: block;
      margin-bottom: 8px;
      text-align: left;
      color: #363844;
      font-weight: bold;
    }

    .name-input {
      width: 100%;
      margin-bottom: 14px;
      border: 1px solid #dedee8;
      background: white;
    }

    .save-button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
    }

    .saved-message {
      margin-top: 14px;
      color: #20a35a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="app">

    <section class="screen" id="homeScreen">
      <header>
        <div class="avatar" id="homeAvatar">F</div>
        <div class="header-text">
          <h1>FLASIM</h1>
          <p class="subtitle" id="homeUserName">Përdoruesi im</p>
        </div>
        <button class="profile-button" onclick="openProfile()" aria-label="Hap profilin">⚙</button>
      </header>

      <div class="contacts">
        <button class="contact" onclick="openChat('Arta', 'A')">
          <div class="avatar" style="background:#e7e6ff">A</div>
          <div class="contact-info">
            <p class="contact-name">Arta</p>
            <p class="last-message">Përshëndetje! Si je?</p>
          </div>
          <span class="online-dot"></span>
        </button>

        <button class="contact" onclick="openChat('Bledi', 'B')">
          <div class="avatar" style="background:#e7e6ff">B</div>
          <div class="contact-info">
            <p class="contact-name">Bledi</p>
            <p class="last-message">Shihemi më vonë!</p>
          </div>
          <span class="online-dot"></span>
        </button>

        <button class="contact" onclick="openChat('Drita', 'D')">
          <div class="avatar" style="background:#e7e6ff">D</div>
          <div class="contact-info">
            <p class="contact-name">Drita</p>
            <p class="last-message">Mirë se erdhe te FLASIM.</p>
          </div>
          <span class="online-dot"></span>
        </button>
      </div>
    </section>

    <section class="screen hidden" id="chatScreen">
      <header>
        <button class="back-button" onclick="goHome()">‹</button>
        <div class="avatar" id="chatAvatar">A</div>
        <div>
          <h1 id="chatName">Arta</h1>
          <p class="subtitle">🟢 Online</p>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="message received">Përshëndetje! 👋<span class="time">Tani</span></div>
      </div>

      <form class="input-area" id="chatForm">
        <input id="messageInput" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off" />
        <button class="send-button" type="submit">➤</button>
      </form>
    </section>

    <section class="screen hidden" id="profileScreen">
      <header>
        <button class="back-button" onclick="goHome()">‹</button>
        <div>
          <h1>Profili im</h1>
          <p class="subtitle">Ndrysho emrin tënd</p>
        </div>
      </header>

      <div class="profile-content">
        <div class="large-avatar" id="largeAvatar">F</div>
        <h2 id="profileName">Përdoruesi im</h2>
        <p>Mirë se erdhe te FLASIM!</p>

        <label class="name-label" for="nameInput">Emri yt</label>
        <input class="name-input" id="nameInput" type="text" placeholder="Shkruaj emrin tënd" />

        <button class="save-button" onclick="saveProfile()">Ruaj profilin</button>
        <div class="saved-message" id="savedMessage"></div>
      </div>
    </section>

  </main>

  <script>
    const homeScreen = document.getElementById("homeScreen");
    const chatScreen = document.getElementById("chatScreen");
    const profileScreen = document.getElementById("profileScreen");
    const chatName = document.getElementById("chatName");
    const chatAvatar = document.getElementById("chatAvatar");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");

    let userName = localStorage.getItem("flasimUserName") || "Përdoruesi im";

    function initial(name) {
      return name.trim().charAt(0).toUpperCase() || "F";
    }

    function updateProfile() {
      document.getElementById("homeUserName").textContent = userName;
      document.getElementById("profileName").textContent = userName;
      document.getElementById("homeAvatar").textContent = initial(userName);
      document.getElementById("largeAvatar").textContent = initial(userName);
      document.getElementById("nameInput").value = userName;
    }

    function openChat(name, letter) {
      chatName.textContent = name;
      chatAvatar.textContent = letter;
      homeScreen.classList.add("hidden");
      profileScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");
    }

    function openProfile() {
      updateProfile();
      homeScreen.classList.add("hidden");
      chatScreen.classList.add("hidden");
      profileScreen.classList.remove("hidden");
    }

    function goHome() {
      chatScreen.classList.add("hidden");
      profileScreen.classList.add("hidden");
      homeScreen.classList.remove("hidden");
    }

    function saveProfile() {
      const newName = document.getElementById("nameInput").value.trim();

      if (!newName) return;

      userName = newName;
      localStorage.setItem("flasimUserName", userName);
      updateProfile();
      document.getElementById("savedMessage").textContent = "Profili u ruajt! ✓";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement("div");
      message.className = "message sent";
      message.innerHTML = text + '<span class="time">Tani</span>';

      messages.appendChild(message);
      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    });

    updateProfile();
  </script>
</body>
</html>
