<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLASIM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6c63ff, #24c6dc);
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: min(760px, 92vh);
      overflow: hidden;
      background: #f6f7fb;
      border-radius: 28px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, .28);
      position: relative;
    }

    .screen {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none;
    }

    header {
      background: #5b54e8;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-size: 21px;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 13px;
      opacity: .85;
    }

    .profile-icon, .contact-avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #5b54e8;
      background: white;
      font-size: 18px;
      font-weight: bold;
    }

    .contacts {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .contact {
      width: 100%;
      border: none;
      background: white;
      cursor: pointer;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
    }

    .contact:hover {
      background: #f0efff;
    }

    .contact-avatar {
      background: #e7e6ff;
      flex-shrink: 0;
    }

    .contact-info {
      flex: 1;
    }

    .contact-name {
      color: #20222d;
      font-size: 16px;
      font-weight: bold;
    }

    .last-message {
      margin-top: 4px;
      color: #797b88;
      font-size: 13px;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #20c56a;
    }

    .back-button {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 26px;
      width: 28px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 15px;
    }

    .received {
      align-self: flex-start;
      color: #20222d;
      background: white;
      border-bottom-left-radius: 4px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .06);
    }

    .sent {
      align-self: flex-end;
      color: white;
      background: #5b54e8;
      border-bottom-right-radius: 4px;
    }

    .time {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      opacity: .65;
    }

    .input-area {
      border-top: 1px solid #e8e8ef;
      background: white;
      padding: 12px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 13px 16px;
      background: #f1f2f7;
      font-size: 15px;
    }

    .send-button {
      width: 48px;
      border: none;
      border-radius: 50%;
      color: white;
      background: #5b54e8;
      cursor: pointer;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <main class="app">

    <section class="screen" id="homeScreen">
      <header>
        <div class="profile-icon">F</div>
        <div>
          <h1>FLASIM</h1>
          <p class="subtitle">Bisedat e tua</p>
        </div>
      </header>

      <div class="contacts">
        <button class="contact" onclick="openChat('Arta', 'A')">
          <div class="contact-avatar">A</div>
          <div class="contact-info">
            <p class="contact-name">Arta</p>
            <p class="last-message">Përshëndetje! Si je?</p>
          </div>
          <span class="online-dot"></span>
        </button>

        <button class="contact" onclick="openChat('Bledi', 'B')">
          <div class="contact-avatar">B</div>
          <div class="contact-info">
            <p class="contact-name">Bledi</p>
            <p class="last-message">Shihemi më vonë!</p>
          </div>
          <span class="online-dot"></span>
        </button>

        <button class="contact" onclick="openChat('Drita', 'D')">
          <div class="contact-avatar">D</div>
          <div class="contact-info">
            <p class="contact-name">Drita</p>
            <p class="last-message">Mirë se erdhe te FLASIM.</p>
          </div>
          <span class="online-dot"></span>
        </button>
      </div>
    </section>

    <section class="screen hidden" id="chatScreen">
      <header>
        <button class="back-button" onclick="goHome()">‹</button>
        <div class="profile-icon" id="chatAvatar">A</div>
        <div>
          <h1 id="chatName">Arta</h1>
          <p class="subtitle">🟢 Online</p>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="message received">
          Përshëndetje! 👋
          <span class="time">Tani</span>
        </div>
      </div>

      <form class="input-area" id="chatForm">
        <input id="messageInput" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off" />
        <button class="send-button" type="submit">➤</button>
      </form>
    </section>

  </main>

  <script>
    const homeScreen = document.getElementById("homeScreen");
    const chatScreen = document.getElementById("chatScreen");
    const chatName = document.getElementById("chatName");
    const chatAvatar = document.getElementById("chatAvatar");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");

    function openChat(name, initial) {
      chatName.textContent = name;
      chatAvatar.textContent = initial;
      homeScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");
    }

    function goHome() {
      chatScreen.classList.add("hidden");
      homeScreen.classList.remove("hidden");
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement("div");
      message.className = "message sent";
      message.textContent = text;

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = "Tani";

      message.appendChild(time);
      messages.appendChild(message);
      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
