<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLASIM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: linear-gradient(135deg, #6c63ff, #24c6dc);
    }
    .app {
      width: 100%; max-width: 430px; height: min(760px, 92vh); overflow: hidden;
      border-radius: 28px; background: #f6f7fb; box-shadow: 0 20px 55px rgba(0,0,0,.28);
    }
    .screen { height: 100%; display: flex; flex-direction: column; }
    .hidden { display: none; }
    header {
      color: white; background: #5b54e8; padding: 18px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    h1 { font-size: 21px; }
    .subtitle { margin-top: 3px; font-size: 13px; opacity: .85; }
    .header-text, .contact-info { flex: 1; }

    .avatar {
      width: 46px; height: 46px; display: grid; place-items: center; flex-shrink: 0;
      border-radius: 50%; color: #5b54e8; background: white; font-weight: bold; font-size: 18px;
    }
    .back-button, .profile-button {
      border: none; color: white; background: transparent; cursor: pointer; font-size: 24px;
    }
    .back-button { width: 28px; }

    .auth-content {
      flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px;
    }
    .auth-logo {
      width: 82px; height: 82px; margin: 0 auto 20px; display: grid; place-items: center;
      border-radius: 50%; background: #5b54e8; color: white; font-size: 34px; font-weight: bold;
    }
    .auth-content h2 { text-align: center; color: #20222d; margin-bottom: 8px; }
    .auth-content p { text-align: center; color: #777987; margin-bottom: 26px; }
    .field-label { display: block; margin: 12px 0 7px; color: #363844; font-weight: bold; font-size: 14px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; border: 1px solid #dedee8; outline: none; border-radius: 14px;
      padding: 14px; background: white; font-size: 15px;
    }
    .main-button {
      width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 14px;
      cursor: pointer; color: white; background: #5b54e8; font-size: 16px; font-weight: bold;
    }
    .link-button {
      margin-top: 18px; border: none; background: transparent; color: #5b54e8;
      cursor: pointer; font-size: 14px;
    }
    .error-message { min-height: 20px; margin-top: 12px; text-align: center; color: #d83b4a; font-size: 13px; }

    .contacts { flex: 1; overflow-y: auto; padding: 12px; }
    .contact {
      width: 100%; margin-bottom: 10px; padding: 14px; border: none; border-radius: 16px;
      display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
      background: white; box-shadow: 0 3px 10px rgba(0,0,0,.05);
    }
    .contact:hover { background: #f0efff; }
    .contact-name { color: #20222d; font-size: 16px; font-weight: bold; }
    .last-message { margin-top: 4px; color: #797b88; font-size: 13px; }
    .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #20c56a; }

    .messages {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .message {
      max-width: 78%; padding: 12px 14px; border-radius: 18px;
      font-size: 15px; line-height: 1.4;
    }
    .received { align-self: flex-start; color: #20222d; background: white; border-bottom-left-radius: 4px; }
    .sent { align-self: flex-end; color: white; background: #5b54e8; border-bottom-right-radius: 4px; }
    .message img { display: block; max-width: 100%; max-height: 260px; border-radius: 12px; margin-bottom: 5px; }
    .time { display: block; margin-top: 5px; font-size: 11px; opacity: .65; }

    .input-area {
      padding: 12px; display: flex; align-items: center; gap: 8px;
      background: white; border-top: 1px solid #e8e8ef;
    }
    .input-area input { flex: 1; border: none; border-radius: 22px; background: #f1f2f7; }
    #photoInput { display: none; }
    .photo-button, .send-button {
      border: none; cursor: pointer; color: white; background: #5b54e8;
    }
    .photo-button { width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: grid; place-items: center; }
    .send-button { width: 48px; height: 48px; border-radius: 50%; font-size: 20px; }

    .profile-content { flex: 1; padding: 32px 22px; text-align: center; }
    .large-avatar {
      width: 105px; height: 105px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 50%; color: white; background: #5b54e8; font-size: 42px; font-weight: bold;
    }
    .profile-content h2 { color: #20222d; margin-bottom: 8px; }
    .profile-content p { color: #797b88; margin-bottom: 28px; }
    .save-button, .logout-button {
      width: 100%; margin-top: 14px; padding: 14px; border: none; border-radius: 14px;
      cursor: pointer; color: white; background: #5b54e8; font-size: 16px; font-weight: bold;
    }
    .logout-button { background: #e14857; }
    .saved-message { margin-top: 12px; color: #20a35a; font-size: 14px; }
  </style>
</head>
<body>
  <main class="app">

    <section class="screen" id="authScreen">
      <div class="auth-content">
        <div class="auth-logo">F</div>
        <h2 id="authTitle">Mirë se erdhe!</h2>
        <p id="authSubtitle">Hyr në FLASIM për të vazhduar.</p>

        <label class="field-label" for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="email@shembull.com">

        <label class="field-label" for="passwordInput">Fjalëkalimi</label>
        <input id="passwordInput" type="password" placeholder="Të paktën 6 karaktere">

        <button class="main-button" id="authButton">Hyr</button>
        <button class="link-button" id="switchAuthButton">Nuk ke llogari? Krijo një</button>
        <div class="error-message" id="authMessage"></div>
      </div>
    </section>

    <section class="screen hidden" id="homeScreen">
      <header>
        <div class="avatar" id="homeAvatar">F</div>
        <div class="header-text">
          <h1>FLASIM</h1>
          <p class="subtitle" id="homeUserName">Përdoruesi im</p>
        </div>
        <button class="profile-button" id="profileButton">⚙</button>
      </header>

      <div class="contacts">
        <button class="contact" data-name="Arta" data-letter="A">
          <div class="avatar" style="background:#e7e6ff">A</div>
          <div class="contact-info">
            <p class="contact-name">Arta</p>
            <p class="last-message">Përshëndetje! Si je?</p>
          </div>
          <span class="online-dot"></span>
        </button>

        <button class="contact" data-name="Bledi" data-letter="B">
          <div class="avatar" style="background:#e7e6ff">B</div>
          <div class="contact-info">
            <p class="contact-name">Bledi</p>
            <p class="last-message">Shihemi më vonë!</p>
          </div>
          <span class="online-dot"></span>
        </button>

        <button class="contact" data-name="Drita" data-letter="D">
          <div class="avatar" style="background:#e7e6ff">D</div>
          <div class="contact-info">
            <p class="contact-name">Drita</p>
            <p class="last-message">Mirë se erdhe te FLASIM.</p>
          </div>
          <span class="online-dot"></span>
        </button>
      </div>
    </section>

    <section class="screen hidden" id="chatScreen">
      <header>
        <button class="back-button" id="chatBackButton">‹</button>
        <div class="avatar" id="chatAvatar">A</div>
        <div>
          <h1 id="chatName">Arta</h1>
          <p class="subtitle">🟢 Online</p>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="message received">Përshëndetje! 👋<span class="time">Tani</span></div>
      </div>

      <form class="input-area" id="chatForm">
        <label class="photo-button" for="photoInput">📷</label>
        <input id="photoInput" type="file" accept="image/*">
        <input id="messageInput" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off">
        <button class="send-button" type="submit">➤</button>
      </form>
    </section>

    <section class="screen hidden" id="profileScreen">
      <header>
        <button class="back-button" id="profileBackButton">‹</button>
        <div>
          <h1>Profili im</h1>
          <p class="subtitle">Ndrysho emrin tënd</p>
        </div>
      </header>

      <div class="profile-content">
        <div class="large-avatar" id="largeAvatar">F</div>
        <h2 id="profileName">Përdoruesi im</h2>
        <p id="profileEmail"></p>

        <label class="field-label" for="nameInput">Emri yt</label>
        <input id="nameInput" type="text" placeholder="Shkruaj emrin tënd">

        <button class="save-button" id="saveProfileButton">Ruaj profilin</button>
        <button class="logout-button" id="logoutButton">Dil nga llogaria</button>
        <div class="saved-message" id="savedMessage"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEyYEv_SQikTzRA51x0HWo5cwTpffc6oU",
      authDomain: "flasim-69e5c.firebaseapp.com",
      projectId: "flasim-69e5c",
      storageBucket: "flasim-69e5c.firebasestorage.app",
      messagingSenderId: "599194697686",
      appId: "1:599194697686:web:a66dca84b631e2c4b06e77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authScreen = document.getElementById("authScreen");
    const homeScreen = document.getElementById("homeScreen");
    const chatScreen = document.getElementById("chatScreen");
    const profileScreen = document.getElementById("profileScreen");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const authButton = document.getElementById("authButton");
    const switchAuthButton = document.getElementById("switchAuthButton");
    const authMessage = document.getElementById("authMessage");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");

    let createMode = false;
    let currentUser = null;
    let userName = "";

    function initial(name) {
      return name.trim().charAt(0).toUpperCase() || "F";
    }

    function showScreen(screen) {
      [authScreen, homeScreen, chatScreen, profileScreen].forEach(item => item.classList.add("hidden"));
      screen.classList.remove("hidden");
    }

    function updateProfile() {
      document.getElementById("homeUserName").textContent = userName;
      document.getElementById("profileName").textContent = userName;
      document.getElementById("profileEmail").textContent = currentUser.email;
      document.getElementById("homeAvatar").textContent = initial(userName);
      document.getElementById("largeAvatar").textContent = initial(userName);
      document.getElementById("nameInput").value = userName;
    }

    function setAuthMode() {
      authMessage.textContent = "";
      authTitle.textContent = createMode ? "Krijo llogari" : "Mirë se erdhe!";
      authSubtitle.textContent = createMode
        ? "Krijo llogarinë tënde në FLASIM."
        : "Hyr në FLASIM për të vazhduar.";
      authButton.textContent = createMode ? "Krijo llogari" : "Hyr";
      switchAuthButton.textContent = createMode
        ? "Ke llogari? Hyr këtu"
        : "Nuk ke llogari? Krijo një";
    }

    switchAuthButton.addEventListener("click", () => {
      createMode = !createMode;
      setAuthMode();
    });

    authButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        authMessage.textContent = "Plotëso email-in dhe fjalëkalimin.";
        return;
      }

      authMessage.textContent = "Duke u lidhur...";

      try {
        if (createMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        authMessage.textContent = "";
      } catch (error) {
        if (error.code === "auth/email-already-in-use") {
          authMessage.textContent = "Ky email ka një llogari. Provo të hysh.";
        } else if (error.code === "auth/invalid-credential") {
          authMessage.textContent = "Email-i ose fjalëkalimi nuk është i saktë.";
        } else if (error.code === "auth/weak-password") {
          authMessage.textContent = "Fjalëkalimi duhet të ketë të paktën 6 karaktere.";
        } else {
          authMessage.textContent = "Provo përsëri. " + error.message;
        }
      }
    });

    onAuthStateChanged(auth, user => {
      currentUser = user;

      if (user) {
        const storedName = localStorage.getItem("flasimUserName");
        userName = storedName || user.email.split("@")[0];
        updateProfile();
        showScreen(homeScreen);
      } else {
        emailInput.value = "";
        passwordInput.value = "";
        showScreen(authScreen);
      }
    });

    document.querySelectorAll(".contact").forEach(contact => {
      contact.addEventListener("click", () => {
        document.getElementById("chatName").textContent = contact.dataset.name;
        document.getElementById("chatAvatar").textContent = contact.dataset.letter;
        showScreen(chatScreen);
      });
    });

    document.getElementById("chatBackButton").addEventListener("click", () => showScreen(homeScreen));
    document.getElementById("profileBackButton").addEventListener("click", () => showScreen(homeScreen));

    document.getElementById("profileButton").addEventListener("click", () => {
      updateProfile();
      document.getElementById("savedMessage").textContent = "";
      showScreen(profileScreen);
    });

    document.getElementById("saveProfileButton").addEventListener("click", () => {
      const newName = document.getElementById("nameInput").value.trim();
      if (!newName) return;

      userName = newName;
      localStorage.setItem("flasimUserName", userName);
      updateProfile();
      document.getElementById("savedMessage").textContent = "Profili u ruajt! ✓";
    });

    document.getElementById("logoutButton").addEventListener("click", () => signOut(auth));

    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const photoInput = document.getElementById("photoInput");

    document.getElementById("chatForm").addEventListener("submit", event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      const message = document.createElement("div");
      const time = document.createElement("span");

      message.className = "message sent";
      message.textContent = text;
      time.className = "time";
      time.textContent = "Tani";

      message.appendChild(time);
      messages.appendChild(message);
      messageInput.value = "";
      messages.scrollTop = messages.scrollHeight;
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = event => {
        const message = document.createElement("div");
        const image = document.createElement("img");
        const time = document.createElement("span");

        message.className = "message sent";
        image.src = event.target.result;
        image.alt = "Foto e dërguar";
        time.className = "time";
        time.textContent = "Tani";

        message.appendChild(image);
        message.appendChild(time);
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
      };

      reader.readAsDataURL(file);
      photoInput.value = "";
    });
  </script>
</body>
</html>
